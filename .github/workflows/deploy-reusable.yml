# Workflow RÉUTILISABLE — à pousser dans le repo GitHub  d-corp/.github
# chemin exact :  d-corp/.github  ->  .github/workflows/deploy-reusable.yml
#
# Écrit UNE fois, appelé par tous les projets. Build -> push ghcr -> déploie
# via un appel webhook HTTPS à la Docky Console (plus fiable qu'un SSH direct
# sur le VPS, qui timeoutait parfois sur la connexion).
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      project:
        description: "Nom du stack sur le VPS (dossier stacks/<project>). Plusieurs services d'un même monorepo partagent le même project."
        required: true
        type: string
      image:
        description: "Nom de l'image ghcr, si différent de project (cas monorepo multi-services). Défaut : project."
        required: false
        type: string
        default: ""
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      context:
        required: false
        type: string
        default: "."

jobs:
  # Séparé du déploiement : un "Re-run failed jobs" sur un échec du webhook
  # ne repasse plus par un rebuild+repush complet, seul `deploy` est rejoué.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Résout le nom d'image
        id: vars
        run: echo "image=${{ inputs.image || inputs.project }}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/d-corp/${{ steps.vars.outputs.image }}:latest
            ghcr.io/d-corp/${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.vars.outputs.image }}
          cache-to: type=gha,mode=max,scope=${{ steps.vars.outputs.image }}

  # Crée un tag `deploy::<projet>::<sha>` après le push ghcr : c'est cet event
  # "create" (émis par l'infra GitHub, pas par le runner) qui déclenche le
  # webhook GitHub natif reçu par la console, les runners ne pouvant plus
  # joindre console.d-app.fr directement (blocage réseau sortant). Le format
  # "deploy::<projet>::<sha>" encode le projet dans le tag lui-même : un seul
  # webhook GitHub par repo suffit même pour un monorepo multi-services (ex.
  # D-Mem : d-mem, d-mem-app, discord-ticket-bot partagent le même repo mais
  # doivent déployer des stacks différentes) — la console résout le projet
  # depuis le tag, pas depuis repository.name. Repli sur l'ancien format
  # "deploy-<sha>" si `project` n'est pas renseigné (ne devrait pas arriver,
  # `project` est `required: true`, mais évite un tag cassé "deploy::::<sha>").
  # Le caller doit accorder `permissions: contents: write` (le plafond du
  # GITHUB_TOKEN d'un appelant de reusable workflow est fixé par ses propres
  # `permissions:`, pas par celles déclarées ici).
  tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Crée et pousse le tag deploy
        run: |
          if [ -n "${{ inputs.project }}" ]; then
            TAG="deploy::${{ inputs.project }}::${GITHUB_SHA}"
          else
            TAG="deploy-${GITHUB_SHA}"
          fi
          git tag "$TAG"
          git push origin "$TAG"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy (webhook)
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 300 \
            -X POST "https://console.d-app.fr/api/deploy/${{ inputs.project }}" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
