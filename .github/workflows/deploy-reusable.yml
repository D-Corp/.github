# Workflow RÉUTILISABLE — à pousser dans le repo GitHub  d-corp/.github
# chemin exact :  d-corp/.github  ->  .github/workflows/deploy-reusable.yml
#
# Écrit UNE fois, appelé par tous les projets. Build -> push ghcr -> deploy SSH.
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      project:
        description: "Nom du projet = nom de l'image ghcr et du stack sur le VPS"
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      context:
        required: false
        type: string
        default: "."

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/d-corp/${{ inputs.project }}:latest
            ghcr.io/d-corp/${{ inputs.project }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: /opt/docky/scripts/deploy.sh ${{ inputs.project }}
