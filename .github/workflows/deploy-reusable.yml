# Workflow RÉUTILISABLE — à pousser dans le repo GitHub  d-corp/.github
# chemin exact :  d-corp/.github  ->  .github/workflows/deploy-reusable.yml
#
# Écrit UNE fois, appelé par tous les projets. Build -> push ghcr -> déploie
# via un appel webhook HTTPS à la Docky Console (plus fiable qu'un SSH direct
# sur le VPS, qui timeoutait parfois sur la connexion).
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      project:
        description: "Nom du stack sur le VPS (dossier stacks/<project>). Plusieurs services d'un même monorepo partagent le même project."
        required: true
        type: string
      image:
        description: "Nom de l'image ghcr, si différent de project (cas monorepo multi-services). Défaut : project."
        required: false
        type: string
        default: ""
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      context:
        required: false
        type: string
        default: "."

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Résout le nom d'image
        id: vars
        run: echo "image=${{ inputs.image || inputs.project }}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/d-corp/${{ steps.vars.outputs.image }}:latest
            ghcr.io/d-corp/${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy (webhook)
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 300 \
            -X POST "https://console.d-app.fr/api/deploy/${{ inputs.project }}" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
